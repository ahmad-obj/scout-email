[project]
name = "scout-email"
version = "0.1.0"
description = "Local-first evidence-backed outreach pipeline for WEBERAISE"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn>=0.34",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.22",
  "alembic>=1.14",
  "rapidfuzz>=3.14",
  "httpx>=0.28",
  "beautifulsoup4>=4.13",
  "lxml>=5.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_email"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
