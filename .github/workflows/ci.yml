name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pytest pytest-asyncio
      - name: Run migrations and backend tests
        working-directory: backend
        run: |
          export SCOUT_EMAIL_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/ci.db"
          alembic upgrade head
          pytest -q

  browser-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ./browser-worker
          pip install pytest pytest-asyncio httpx
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser worker tests
        working-directory: browser-worker
        run: pytest -q

  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify backend lockfile
        run: uv lock --check --project backend

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local runtime directories
        run: |
          cp .env.example .env
          mkdir -p data n8n_data
          sudo chown -R 1000:1000 data n8n_data
      - name: Validate compose configuration
        run: docker compose config >/dev/null
      - name: Build local service images
        run: docker compose build outreach-api browser-worker
      - name: Start local stack
        run: docker compose up -d
      - name: Verify API health and stack state
        run: |
          docker compose ps
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs outreach-api browser-worker n8n
          exit 1
      - name: Stop local stack
        if: always()
        run: docker compose down

  live-maps-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-maps]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ./browser-worker
          pip install pytest pytest-asyncio
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run one bounded live Maps query
        working-directory: browser-worker
        env:
          MAPS_LIVE_SMOKE_ENABLED: "true"
        run: pytest tests/test_maps_live.py -q
