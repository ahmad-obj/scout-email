name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pytest pytest-asyncio
      - name: Run migrations and backend tests
        working-directory: backend
        run: |
          export SCOUT_EMAIL_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/ci.db"
          alembic upgrade head
          pytest -q

  browser-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ./browser-worker
          pip install pytest pytest-asyncio httpx
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser worker tests
        working-directory: browser-worker
        run: pytest -q

  lockfile-bootstrap:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Resolve and persist backend lockfile once
        run: |
          uv lock --project backend
          if [ -n "$(git status --porcelain -- backend/uv.lock)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add backend/uv.lock
            git commit -m "chore: lock backend dependencies"
            git push origin HEAD:feat/v1-foundation
          fi

  live-maps-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-maps]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ./browser-worker
          pip install pytest pytest-asyncio
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run one bounded live Maps query
        working-directory: browser-worker
        env:
          MAPS_LIVE_SMOKE_ENABLED: "true"
        run: pytest tests/test_maps_live.py -q
