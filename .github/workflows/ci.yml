name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pytest pytest-asyncio
      - name: Run migrations and backend tests
        working-directory: backend
        run: |
          export SCOUT_EMAIL_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/ci.db"
          alembic upgrade head
          pytest -q

  browser-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser worker
        run: |
          python -m pip install --upgrade pip
          pip install -e ./browser-worker
          pip install pytest pytest-asyncio httpx
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser worker tests
        working-directory: browser-worker
        run: pytest -q
